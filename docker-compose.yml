services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Demo defaults. Override in a .env file (see .env.example); never commit real secrets.
      ADMIN_USER: ${ADMIN_USER:-agent}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      SECRET_KEY: ${SECRET_KEY:-}
      DB_PATH: /srv/data/support.db
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    volumes:
      - app-data:/srv/data

  # Optional local LLM for reply drafts:  docker compose --profile llm up
  # then once:  docker compose exec ollama ollama pull llama3.2:3b   and set LLM_PROVIDER=ollama in .env
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    volumes:
      - ollama-models:/root/.ollama

volumes:
  app-data:
  ollama-models:
